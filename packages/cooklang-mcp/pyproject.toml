[project]
name = "cooklang-mcp"
version = "0.2.0"
description = "MCP server over a CookCLI recipe collection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9",
  "httpx>=0.27",
  "recipe-scrapers>=15",
  "beautifulsoup4>=4.12",
  "pyyaml>=6",
]

[project.scripts]
cooklang-mcp = "cooklang_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cooklang_mcp"]
