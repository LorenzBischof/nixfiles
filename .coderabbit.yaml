# CodeRabbit review config: https://docs.coderabbit.ai/reference/configuration
#
# AGENTS.md is picked up as a code guideline by default (knowledge_base.
# code_guidelines), so repo conventions live there, not here. Don't list it in
# path_instructions: that makes CodeRabbit review the file instead of applying it.
language: en-US

reviews:
  profile: chill
  poem: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Dependabot flake.lock bumps already get the analyze-claude job in
    # build.yaml, and the plan's hourly review allowance is small: spend it on
    # human-written changes.
    ignore_usernames:
      - "dependabot[bot]"

  path_filters:
    - "!flake.lock"
    - "!**/*.lock"

  # CodeRabbit has no Nix linter (no statix, deadnix or nixfmt). CI already
  # evaluates and builds every host, and AGENTS.md (read as a guideline) covers
  # the repo conventions, so this only points at what neither catches: things
  # that build fine and break at runtime.
  path_instructions:
    - path: "**/*.nix"
      instructions: |
        CI runs `nix flake check` and builds every host, so skip anything that
        would fail evaluation or the build, and skip formatting. Focus on what
        builds but misbehaves at runtime:
        - Scripts and systemd units relying on PATH instead of `lib.getExe` or a
          store path; missing runtimeInputs.
        - systemd ordering and dependencies: `after`/`wants` on
          network-online.target, mounts, or other services the unit needs.
        - Option values that are valid but wrong: ports, users and groups,
          file permissions, firewall openings, paths that differ between hosts.
        - Secret values that would end up in the world-readable Nix store.
        - Unused `let` bindings and function arguments.
    - path: ".github/workflows/**"
      instructions: |
        This repo and its Actions logs are public. Flag any step that could print
        a secret or an evaluated `secrets.*` Nix value, untrusted PR input
        (titles, branch names, bodies) interpolated straight into `run:`, and
        jobs with broader `permissions` than they use.

  tools:
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true
