# A throwaway x86_64 machine with KVM for agents on the vps, which is aarch64
# and has none. `gha-vm` (hosts/vps/agents.nix) dispatches this on
# lorenzbischof-agents/nixfiles and reaches it through dumbpipe, an iroh
# connection that both ends dial out for: neither the vps nor the runner accepts
# incoming connections, and the traffic is end-to-end encrypted, so none of it
# reaches this public log. The commit status carries the runner's endpoint
# ticket, which is public.
name: vm
on:
  workflow_dispatch:
    inputs:
      ssh_key:
        description: SSH public key allowed to log in
        type: string
        required: true
      minutes:
        description: Lifetime in minutes
        type: number
        default: 60
      nixpkgs:
        description: The vps's nixpkgs revision, for openssh and dumbpipe
        type: string
        required: true
permissions:
  statuses: write
jobs:
  vm:
    runs-on: ubuntu-latest
    steps:
      # Also opens /dev/kvm, makes runner a trusted user, and so gives the
      # daemon the kvm system feature.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # TODO: the vps's dumbpipe, from packages/dumbpipe.nix: see there. It is
      # not in cache.nixos.org, so the first run after it changes builds it and
      # keeps it in this repository's Actions cache. Drop these steps with that
      # file, and take dumbpipe from nixpkgs again below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/dumbpipe.nix
          sparse-checkout-cone-mode: false
      - name: Find dumbpipe
        id: dumbpipe
        env:
          NIXPKGS: ${{ inputs.nixpkgs }}
        run: |
          expr="(builtins.getFlake \"github:NixOS/nixpkgs/$NIXPKGS\").legacyPackages.x86_64-linux.callPackage ./packages/dumbpipe.nix { }"
          echo "expr=$expr" >>"$GITHUB_OUTPUT"
          echo "out=$(nix eval --impure --raw --expr "$expr")" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ~/dumbpipe-cache
          key: ${{ steps.dumbpipe.outputs.out }}
      - name: Build dumbpipe
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          EXPR: ${{ steps.dumbpipe.outputs.expr }}
        run: |
          nix build --impure --no-link --expr "$EXPR"
          nix copy --to "file://$HOME/dumbpipe-cache" "$(nix eval --impure --raw --expr "$EXPR")"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/dumbpipe-cache
          key: ${{ steps.dumbpipe.outputs.out }}
      - name: Serve
        env:
          SSH_KEY: ${{ inputs.ssh_key }}
          MINUTES: ${{ inputs.minutes }}
          NIXPKGS: ${{ inputs.nixpkgs }}
          DUMBPIPE: ${{ steps.dumbpipe.outputs.out }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$RUNNER_TEMP/vm
          mkdir -m 700 "$dir"
          printf '%s\n' "$SSH_KEY" >"$dir/authorized_keys"
          ssh-keygen -q -t ed25519 -N '' -f "$dir/host_key"
          cat >"$dir/sshd_config" <<EOF
          ListenAddress 127.0.0.1:2222
          HostKey $dir/host_key
          AuthorizedKeysFile $dir/authorized_keys
          PidFile none
          SetEnv PATH=/nix/var/nix/profiles/default/bin:/usr/local/bin:/usr/bin:/bin
          EOF
          # Unsigned, but this run built it, or an earlier one did.
          nix copy --no-check-sigs --from "file://$HOME/dumbpipe-cache" "$DUMBPIPE"
          nix profile add "github:NixOS/nixpkgs/$NIXPKGS#openssh" "$DUMBPIPE"
          # Unprivileged, so it can only log in as runner, and without the token.
          env -u GH_TOKEN "$(command -v sshd)" -f "$dir/sshd_config" -E "$dir/sshd.log"
          # Whoever holds this secret can pose as the runner: keep it out of the log.
          IROH_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$IROH_SECRET"
          export IROH_SECRET
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending \
            -f context="vm/$GITHUB_RUN_ID" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$(dumbpipe generate-ticket 2>/dev/null)" >/dev/null
          # The machine is gone once the listener is; 124 is the lifetime running out.
          timeout "${MINUTES}m" dumbpipe listen-tcp --host 127.0.0.1:2222 2>"$dir/dumbpipe.log" || [ $? -eq 124 ]
      - name: Mark stopped
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success \
            -f context="vm/$GITHUB_RUN_ID" -f description=stopped >/dev/null
