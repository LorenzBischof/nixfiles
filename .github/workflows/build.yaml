# https://lgug2z.com/articles/building-and-privately-caching-x86-and-aarch64-nixos-systems-on-github-actions/
name: "build"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
# Jobs that write declare their own permissions block, which replaces this one.
permissions:
  contents: read
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [flake-check, framework, nas, vps]
    env:
      S3_CACHE_STORE_URL: s3://${{ secrets.S3_CACHE_BUCKET }}?endpoint=${{ secrets.S3_CACHE_ENDPOINT }}&region=${{ secrets.S3_CACHE_REGION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: docker/setup-qemu-action@v3
      # Substitution runs in the daemon, which never sees a step's environment:
      # a client-side `nix copy` reads AWS_* from the env, a daemon-side read
      # only consults root's credentials file (NixOS/nix#5723).
      - name: Binary cache credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Region comes from the store URL, so root needs only the key pair.
          sudo -i aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          sudo -i aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: holster
      - uses: cachix/install-nix-action@v31
        with:
          # We set our custom GitHub token for any private flake inputs we might have
          github_access_token: ${{ secrets.GH_TOKEN }}
          extra_nix_config: |
            fallback = true
            http-connections = 128
            max-substitution-jobs = 128
            extra-platforms = aarch64-linux i686-linux
            substituters = https://cache.nixos.org/ ${{ env.S3_CACHE_STORE_URL }}
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= s3:g+tSfjDOsI+PlY7ZGs981O+IIAYadMSzSz4NMm/kwIk=
      - name: Build
        id: build
        run: |
          set +e
          if [ "${{ matrix.target }}" = "flake-check" ]; then
            nix flake check -L 2>&1 | tee build.log
            exit_code=${PIPESTATUS[0]}
          else
            nix build -L .#nixosConfigurations.${{ matrix.target }}.config.system.build.toplevel 2>&1 | tee build.log
            exit_code=${PIPESTATUS[0]}
          fi
          exit $exit_code
      - name: Push to S3 cache
        if: ${{ success() && matrix.target != 'flake-check' }}
        env:
          S3_CACHE_BUCKET: ${{ secrets.S3_CACHE_BUCKET }}
          AWS_ENDPOINT_URL: https://${{ secrets.S3_CACHE_ENDPOINT }}
          AWS_REGION: ${{ secrets.S3_CACHE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_ACCESS_KEY }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          out=$(readlink -f result)
          # printenv, not echo, so the key can't reach the log; umask so it is
          # never briefly world-readable.
          umask 077
          key="$RUNNER_TEMP/nix-cache-signing-key"
          printenv NIX_CACHE_SIGNING_KEY > "$key"
          nix store sign --recursive --key-file "$key" "$out"
          # `nix copy` can't upload the filtered subset directly: a binary-cache
          # destination rejects paths whose references it doesn't already hold,
          # and --no-recursive doesn't exempt it (NixOS/nix#12835). So nix writes
          # the complete closure locally and the filter moves to the upload. An
          # incomplete bucket only hurts `nix copy` *from* it; hosts substitute
          # the rest from cache.nixos.org. zstd: this staging copy is discarded.
          # Both on /nix: the btrfs volume nothing-but-nix mounts there is the
          # only filesystem with room. $RUNNER_TEMP and the TMPDIR it hands us
          # (/mnt/tmp.*) are both on /, which the runner image leaves at ~1GB
          # free — and nix buffers each compressed NAR in TMPDIR before writing
          # it to the cache, so a multi-GB path overflows that on its own.
          staging=/nix/.cache-staging
          export TMPDIR=/nix/.cache-tmp
          sudo install -d -o "$(id -u)" -g "$(id -g)" "$staging" "$TMPDIR"
          nix copy --to "file://$staging?compression=zstd" "$out"
          # Everything cache.nixos.org doesn't serve (locally built paths are
          # unsigned, so they pass too). One awk, not grep|awk, so an empty
          # result can't trip `pipefail`.
          nix path-info --recursive --sigs "$out" \
            | awk '!/cache\.nixos\.org-1:/ { print $1 }' > "$RUNNER_TEMP/paths"
          # Each path contributes its .narinfo plus the NAR that narinfo names.
          includes=(--include nix-cache-info)
          while read -r path; do
            hash=${path#/nix/store/}
            hash=${hash%%-*}
            includes+=(--include "$hash.narinfo")
            includes+=(--include "$(awk '/^URL: / { print $2 }' "$staging/$hash.narinfo")")
          done < "$RUNNER_TEMP/paths"
          # --size-only: these names are content-addressed, so a key already
          # there at the same size needs no re-upload — a plain sync compares
          # mtimes and would re-send everything. No --delete, so this never
          # prunes.
          aws s3 sync "$staging" "s3://$S3_CACHE_BUCKET" \
            --size-only --no-progress --exclude '*' "${includes[@]}"
      - name: Upload build log
        # Upload on success too: a clean build's log still carries the
        # deprecation warnings the analyze job scans for.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build.log

  analyze-claude:
    needs: build
    # Every Dependabot flake.lock bump, pass or fail: diagnose/fix build breaks
    # and flag deprecation warnings the bump introduced. `!cancelled()` lets it
    # run regardless of the build result (a plain `needs` would skip on failure).
    # On the pusher, not the PR author, which stays dependabot[bot] for the life
    # of the PR: the fix this job pushes leaves flake.lock untouched, so the run
    # it triggers has nothing new to analyse and the builds alone prove the fix.
    # Only dependabot pushes a new lock (its own bump, or a rebase), and a fork
    # PR never has it as sender, so this still never runs on outside code.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.sender.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      # `false` is the only value that lets auto-merge through, so a missing or
      # empty output holds the PR rather than waving it through unchecked.
      merge-hold: ${{ steps.verdict.outputs.hold }}
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head branch so the fix commits back onto it; the
          # persisted GITHUB_TOKEN is what `git push` uses below.
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 20
      # Minimal surface for a job running on Dependabot input: disk + public
      # cache only, no tailnet/private-cache/QEMU. Builds aren't pushed.
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: holster
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GH_TOKEN }}
          extra_nix_config: |
            fallback = true
            http-connections = 128
            max-substitution-jobs = 128
            substituters = https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - uses: actions/download-artifact@v4
        with:
          pattern: build-log-*
          path: build-logs
      # Which applications the bump actually moved. flake.lock is the only file
      # Dependabot touches, so re-evaluating this tree with the base commit's
      # lock isolates the bump; `app-inventory.nix` reads versions straight off
      # the evaluated config, so nothing is built and nothing is downloaded.
      # Per-host so one broken config still leaves the others diffable — this
      # job runs precisely when a build is broken.
      - name: Application version and release-note diff
        # pipefail matters here: without it a failed `nix eval` is masked by the
        # `jq` at the end of the pipe and the host looks like it lost every app.
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base commit $BASE_SHA not in this checkout, skipping" >&2
            exit 0
          fi
          mkdir -p /tmp/base
          git archive HEAD | tar -x -C /tmp/base
          git show "$BASE_SHA:flake.lock" > /tmp/base/flake.lock
          # Passed as an expression rather than `import`ed: reading an absolute
          # path is forbidden in pure evaluation mode.
          apply=$(cat "$GITHUB_WORKSPACE/.github/app-inventory.nix")
          inventory() {
            nix eval --json "$1#nixosConfigurations.$2.config" --apply "$apply" | jq -r '.[]'
          }
          for target in framework nas vps; do
            inventory path:/tmp/base "$target" > "/tmp/$target.before" || continue
            inventory . "$target" > "/tmp/$target.after" || continue
            diff -U0 --label "$target (before)" --label "$target (after)" \
              "/tmp/$target.before" "/tmp/$target.after" >> pkgdiff.txt || true
          done
          cat pkgdiff.txt || true
          # What upstream wrote down that no build log can show: a changed option
          # default, a module dropped from a package's defaults, a migration to
          # run first. Diffing the release-notes tree between the two nixpkgs
          # revisions leaves only the entries this bump added — a handful of
          # lines, so the agent reads the diff rather than a release's worth of
          # notes. Both revisions are already in the store; the evals above
          # fetched them. Flake inputs aren't flake outputs, hence getFlake.
          nixpkgs_of() {
            nix eval --impure --raw --expr "(builtins.getFlake \"$1\").inputs.nixpkgs.outPath"
          }
          before=$(nixpkgs_of path:/tmp/base) || exit 0
          after=$(nixpkgs_of "path:$GITHUB_WORKSPACE") || exit 0
          # Equal paths mean this bump left nixpkgs alone; `diff` exits 1 on any
          # difference, which `set -e` would take for a step failure.
          if [ "$before" != "$after" ]; then
            diff -r -U0 "$before/nixos/doc/manual/release-notes" \
              "$after/nixos/doc/manual/release-notes" > relnotes.txt || true
          fi
          cat relnotes.txt || true
      # A quick look at what the bump pulled in from the inputs that aren't
      # nixpkgs or home-manager: those two are too big to skim and too closely
      # watched to be the realistic attack, while a small third-party flake is
      # neither. Diffing the fetched source trees rather than the upstream git
      # history shows what will actually be built, so a tarball that doesn't
      # match its own commits shows up too. Both revisions are already in the
      # store; the evals above fetched them.
      - name: Third-party input diff
        shell: bash
        run: |
          if [ ! -f /tmp/base/flake.lock ]; then
            echo "no base tree, skipping" >&2
            exit 0
          fi
          # Root inputs whose locked revision moved. The exclusion is by
          # repository name, not input name, so nixpkgs forks and extra nixpkgs
          # channels drop out too.
          changed=$(jq -nr --slurpfile a /tmp/base/flake.lock --slurpfile b flake.lock '
            def srcs: .[0] as $f | $f.nodes as $n
              | ($f.nodes.root.inputs // {})
              | with_entries(.value = ($n[.value].locked // {}));
            ($a | srcs) as $before | ($b | srcs) as $after
            | $after | to_entries[] | . as $e
            | ($before[$e.key] // empty) as $old
            | select((($old.rev // $old.narHash) != null)
                     and (($old.rev // $old.narHash) != ($e.value.rev // $e.value.narHash)))
            | select(((($e.value.repo // "") | ascii_downcase) | IN("nixpkgs", "home-manager")) | not)
            | [ $e.key,
                (if $e.value.owner then "\($e.value.owner)/\($e.value.repo)"
                 else ($e.value.url // $e.value.type) end),
                ($old.rev // $old.narHash),
                ($e.value.rev // $e.value.narHash),
                ($e.value.type // "") ] | @tsv')
          if [ -z "$changed" ]; then
            echo "no third-party input moved in this bump" > inputdiff.txt
            cat inputdiff.txt
            exit 0
          fi
          outpath() {
            nix eval --impure --raw --expr "(builtins.getFlake \"$1\").inputs.\"$2\".outPath"
          }
          : > inputdiff.txt
          # Each input's complete patch, so nothing is only ever seen truncated.
          # inputdiff.txt stays a bounded overview that points at these.
          mkdir -p input-diffs
          while IFS=$'\t' read -r name repo old new type; do
            if ! before=$(outpath path:/tmp/base "$name") \
              || ! after=$(outpath "path:$GITHUB_WORKSPACE" "$name"); then
              {
                echo "===== $name ($repo) $old -> $new"
                echo "      could not fetch both sources, diff unavailable"
              } >> inputdiff.txt
              continue
            fi
            # Written to files rather than piped: `diff` exits 1 on any
            # difference and a closed `head` pipe exits 141, either of which
            # `pipefail` takes for a step failure.
            files=$RUNNER_TEMP/input-files
            patch=input-diffs/$name.patch
            diff -r -q --no-dereference "$before" "$after" > "$files" 2>&1 || true
            diff -r -u --no-dereference "$before" "$after" > "$patch" 2>&1 || true
            # Store paths carry no meaning for the reader and defeat grep.
            sed -i -e "s#$before#a#g" -e "s#$after#b#g" "$files" "$patch"
            lines=$(wc -l < "$patch")
            {
              echo "===== $name ($repo) $old -> $new"
              # Only github inputs have a compare page; for anything else the
              # patch is all there is.
              if [ "$type" = github ]; then
                echo "      https://github.com/$repo/compare/$old...$new"
              fi
              echo "      full patch: $patch ($lines lines)"
              echo "--- files changed"
              # The file list is the index into the patch, so it is never cut.
              cat "$files"
              if [ "$lines" -gt 200 ]; then
                echo "--- patch, first 200 of $lines lines (rest in $patch)"
              else
                echo "--- patch, complete"
              fi
              head -n 200 "$patch"
            } >> inputdiff.txt
          done <<< "$changed"
          cat inputdiff.txt
      # Build the Claude Code we pin in flake.lock and hand it to the action
      # below, so it skips its own native install (which runs out of disk on the
      # nothing-but-nix runner, where root keeps only a ~2GB reserve).
      - name: Build Claude Code
        id: claude_bin
        run: |
          out=$(nix build --no-link --print-out-paths .#claude-code)
          echo "path=$out/bin/claude" >> "$GITHUB_OUTPUT"
      - name: Load prompt
        id: prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat .github/prompts/analyze-nix-build.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Analyze build with Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Claude pushes the fix, so it needs the
          # write GITHUB_TOKEN in-shell anyway — no point isolating a read-only
          # PAT. gh authenticates with this for reading PRs and upstream issues.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path_to_claude_code_executable: ${{ steps.claude_bin.outputs.path }}
          prompt: ${{ steps.prompt.outputs.content }}
          # Dependabot opens the PR; pushing a fix back re-triggers the run as
          # github-actions[bot]. The `if` still gates on a Dependabot PR author.
          allowed_bots: "dependabot[bot],github-actions[bot]"
          # Surface the full SDK output so failures are diagnosable (the action
          # otherwise hides it "for security").
          show_full_output: true
          # auto mode classifies each tool call (allows safe read/build commands,
          # fails closed in CI on anything risky), so the only list left is a
          # pre-allow for the tools whose blocking would sink the job: the edits
          # and the git commit/push it exists to produce, plus Task, since the
          # prompt delegates the changelog and release-note reading to subagents
          # and that shouldn't depend on how the classifier reads a spawn.
          # Nothing is denied. A `Bash(curl:*)` deny sat here as an egress
          # backstop but never was one — WebFetch reaches any domain the
          # classifier allows, and this job holds a write token it can `git push`
          # with — and it cost a worker a turn when a changelog lived off GitHub.
          #
          # --tools cuts the built-in set to the ones an earlier run actually
          # used (Bash, Read, Edit, Write, WebFetch, ToolSearch) plus Task for
          # the delegation above. Measured 6.4k tokens off every turn's context:
          # tool schemas are not all loaded on demand. It also removes the
          # wait-and-resume tools — Monitor, ScheduleWakeup, Cron*, TaskOutput —
          # which mean nothing in a one-shot job and which that run reached for
          # instead of just waiting. ToolSearch stays because WebFetch arrives
          # deferred and has to be loaded. Unknown names here are ignored
          # silently, so a typo fails open: check against the init message's
          # tool list rather than assuming a name exists.
          claude_args: '--permission-mode auto --add-dir "/nix/store" --tools "Bash,Read,Edit,Write,Task,WebFetch,ToolSearch" --allowedTools "Task,Edit,Write,Bash(git add:*),Bash(git commit:*),Bash(git push:*)"'
          # Two things keep this one-shot job from ending mid-work, since
          # anything still running dies with the session. Background tasks are
          # off, so a build that outlives the 2-minute foreground timeout runs
          # to completion instead of being backgrounded and waited on
          # asynchronously — which is what sank an earlier run: three verification
          # builds were backgrounded, a dozen turns went to polling their output
          # files, and the turn ended waiting on them, so the finished fixes were
          # never pushed. Subagents are unaffected: several spawned in one
          # message still run concurrently and block the turn until they report.
          # And
          # the comment body is what this job exists to produce, so a Stop hook
          # refuses the end of turn while the file is missing: exit 2 hands the
          # stderr back to Claude, making writing it the only way out of the
          # session. Claude Code caps consecutive blocks at 8, so an unwritable
          # file can't wedge the job.
          settings: |
            {
              "env": {
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"
              },
              "hooks": {
                "Stop": [{
                  "hooks": [{
                    "type": "command",
                    "command": "test -s /tmp/claude-analysis.md || { echo 'The analysis comment body is missing. Write the final comment to /tmp/claude-analysis.md, as the prompt requires, before finishing the turn.' >&2; exit 2; }"
                  }]
                }]
              }
            }
      # A file Claude writes to stop this bump from auto-merging, so a
      # third-party input that looks off, or an upgrade upstream itself cautions
      # about, waits for a human instead of deploying. Only for what a green
      # build doesn't catch, and the prompt keeps the bar high: routine
      # migrations are covered by the daily backups and merge as usual. Read
      # before the comment is published, so a failure to post still leaves the
      # hold in place.
      - name: Auto-merge verdict
        id: verdict
        if: ${{ !cancelled() }}
        run: |
          hold=/tmp/claude-merge-hold
          if [ -s "$hold" ]; then
            echo "hold=true" >> "$GITHUB_OUTPUT"
            # One line: a newline would end the workflow command early.
            echo "::warning::auto-merge held: $(head -c 400 "$hold" | tr '\n\r' '  ')"
          else
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish analysis and collapse previous comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          body=$(cat /tmp/claude-analysis.md)
          test -n "$body"
          marker='<!-- claude-build-analysis -->'
          # What the analysis cost, taken from the SDK's own session total: the
          # last element of the execution log is its `result` message, and that
          # total covers the subagents too. It is costed at list API prices
          # whatever the auth mode, so on the subscription token this job uses
          # it reads as the API equivalent rather than a bill. Appended here
          # rather than written by Claude, which can't know its final cost
          # while it is still running. Anything missing or unparsable leaves
          # the footer off: the findings are what the comment is for.
          cost=
          # No file argument would make jq read the step's stdin and wait there.
          if [ -s "${EXECUTION_FILE:-}" ]; then
            cost=$(jq -r 'if type == "array" then .[-1] else . end
              | if .type == "result" and (.total_cost_usd | type) == "number"
                then .total_cost_usd else empty end' "$EXECUTION_FILE" || true)
          fi
          footer=
          if [ -n "$cost" ]; then
            footer=$(printf '\n<sub>Analysis cost: $%.2f</sub>' "$cost")
          fi
          previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-build-analysis -->"))) | .node_id')
          # Publish first so a failed post leaves the previous findings visible.
          printf '%s\n%s\n%s\n' "$marker" "$body" "$footer" | gh pr comment "$PR_NUMBER" --body-file -
          while IFS= read -r id; do
            test -n "$id" || continue
            # $id is a GraphQL variable, not a shell expansion.
            # shellcheck disable=SC2016
            gh api graphql -f id="$id" -f query='
              mutation($id: ID!) {
                minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                  minimizedComment { isMinimized }
                }
              }'
          done <<< "$previous"

  automerge-dependabot:
    # Require passing builds and successful analysis with an explicit no-hold
    # verdict. The bot's fix push skips analysis because flake.lock is unchanged.
    # !cancelled() allows that skipped dependency; check success explicitly.
    needs: [build, analyze-claude]
    if: >-
      ${{
        !cancelled()
        && github.event_name == 'pull_request'
        && github.event.pull_request.user.login == 'dependabot[bot]'
        && needs.build.result == 'success'
        && (
          github.event.sender.login == 'github-actions[bot]'
          || (
            needs.analyze-claude.result == 'success'
            && needs.analyze-claude.outputs.merge-hold == 'false'
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for flake updates
        if: steps.metadata.outputs.package-ecosystem == 'nix'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"

  failure-alert:
    runs-on: ubuntu-latest
    needs: [build, automerge-dependabot]
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    steps:
      - name: Conditionally Fail Required Check
        shell: bash
        run: |
          echo "::error Some required job has failed!"
          exit 1
